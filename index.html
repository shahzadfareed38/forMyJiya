<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Special Wish 💖</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <div class="heart">💖</div>

        <h1>For Someone Special</h1>

        <p class="subtitle">
            I have a little surprise for you Jiya...
        </p>

        <button id="wishButton">
            Open Your Wish 🎁
        </button>

        <div id="message" class="hidden">
            <h2>✨ A Special Wish For You Jiya ✨</h2>

            <p>
                May your life always be filled with
                happiness, love, success and beautiful moments.
                💕
            </p>

            <p class="love">
                Stay happy and keep smiling! ❤️
            </p>
        </div>

    </div>

    <div id="hearts"></div>

    <script src="script.js"></script>

</body>

</html>
